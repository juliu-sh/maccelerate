name: Build validation

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  publication-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check public sources, history and release tooling
        run: |
          python3 diagnostics/test-public-boundary.py
          python3 diagnostics/test-release.py
          python3 dist/public_boundary.py --history
          python3 dist/public_boundary.py --text RELEASE_NOTES_DRAFT.md
  build:
    needs: publication-check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: |
          bash diagnostics/test-swift.sh
          python3 diagnostics/test-public-boundary.py
          python3 dist/public_boundary.py --history
          python3 diagnostics/test-release.py
      - name: Build app and local DMG
        run: |
          ./dist/build.sh
          ./dist/deploy-to-dmg.sh
      - name: Verify bundled licenses, notice, and app signature
        run: |
          test -f build/Maccelerate.app/Contents/Resources/LICENSE
          cmp LICENSE build/Maccelerate.app/Contents/Resources/LICENSE
          cmp LICENSES/InstantSpaceSwitcher-MIT.txt build/Maccelerate.app/Contents/Resources/LICENSES/InstantSpaceSwitcher-MIT.txt
          cmp NOTICE build/Maccelerate.app/Contents/Resources/NOTICE
          cmp LICENSES/Sparkle.txt build/Maccelerate.app/Contents/Resources/LICENSES/Sparkle.txt
          test -d build/Maccelerate.app/Contents/Frameworks/Sparkle.framework
          python3 dist/public_boundary.py --app build/Maccelerate.app
          codesign --verify --deep --strict build/Maccelerate.app
